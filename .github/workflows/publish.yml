name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Set version from tag
        run: npm pkg set version=${GITHUB_REF_NAME#v}

      - name: Build package
        run: npm run package

      - name: Export contracts
        run: npm run export-contracts
        env:
          LECTIO_CONTRACTS_DIR: contracts

      - name: Verify build outputs
        run: |
          test -d dist || (echo "dist/ not found" && exit 1)
          test -f dist/index.js || (echo "dist/index.js not found" && exit 1)
          test -f dist/index.d.ts || (echo "dist/index.d.ts not found" && exit 1)
          test -d contracts || (echo "contracts/ not found" && exit 1)
          echo "Build verification passed"

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.LECTIO_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Published version ${{ github.ref_name }} to npm.

            Install: `npm install lectio@${{ github.ref_name }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
